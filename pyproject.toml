[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calender-agent"
version = "1.0.0"
description = "Production-ready AI Calendar Agent with Google Calendar, MongoDB, FastAPI, and LangChain"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ─────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # ── LangChain + LLM ───────────────────────────────
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",

    # ── Google APIs ───────────────────────────────────
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.147.0",

    # ── MongoDB ───────────────────────────────────────
    "motor>=3.6.0",
    "beanie>=1.26.0",
    "pymongo>=4.9.0",
    "certifi>=2024.0.0",

    # ── Config & Validation ───────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",

    # ── Auth / Security ───────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",

    # ── Retry & Resilience ────────────────────────────
    "tenacity>=9.0.0",

    # ── Logging & Observability ───────────────────────
    "structlog>=24.4.0",
    "rich>=13.9.0",

    # ── Rate Limiting ─────────────────────────────────
    "slowapi>=0.1.9",

    # ── Utilities ─────────────────────────────────────
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "mongomock-motor>=0.0.34",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
